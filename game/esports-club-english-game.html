<title>Esports Club English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a match-day control room. One dark broadcast world: lower-third header, chamfered
   panels, trading-card players, scoreboard numbers. The club you manage tints the whole page (--club-h). */
:root {
  --club-h: 196;                                    /* hue of the club you manage; set from JS */
  --bg: #080c14;                                    /* deep ink */
  --bg-2: #0e1626;
  --surface: #111b2e;
  --surface-2: #182640;
  --line: #243653;
  --fg: #e9eff8;
  --muted: #93a7c0;
  --club: hsl(var(--club-h) 78% 58%);
  --club-dim: hsl(var(--club-h) 55% 26%);
  --club-ink: hsl(var(--club-h) 60% 10%);
  --gold: #f2c75c;
  --good: #52d6a0;
  --warn: #f2ab4c;
  --bad: #f2705f;
  --mark: #5b2622;
  --mark-fg: #ffd9d3;
  --diamond: #63e2f6; --goldc: #f2c75c; --silver: #bcc8d8; --bronze: #c98d5d;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
body {
  color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  background:
    radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--club) 20%, transparent), transparent 70%),
    repeating-linear-gradient(60deg, transparent 0 46px, rgba(255,255,255,.018) 46px 47px),
    var(--bg);
  background-color: var(--bg);
}
* { box-sizing: border-box; }
#shell { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-size: 34px; } h3 { font-size: 22px; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-family: var(--font-display); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.spread { justify-content: space-between; }
.grow { flex: 1 1 0; min-width: 0; }

/* lower-third header */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding-block: 10px; margin-bottom: 26px; }
#top .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
#brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
.brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-family: var(--font-display); font-size: 16px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; padding: 6px 10px; cursor: pointer; }
nav button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--club); }
#savestate { font-size: 12px; color: var(--muted); }

/* badge: hexagon with the club's initials */
.badge { --h: var(--club-h); --s: 44px; width: var(--s); height: var(--s); flex: none; display: inline-grid; place-items: center; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); background: linear-gradient(150deg, hsl(var(--h) 80% 62%), hsl(var(--h) 70% 34%)); color: hsl(var(--h) 60% 8%); font-family: var(--font-display); font-weight: 700; font-size: calc(var(--s) * .36); letter-spacing: .02em; }

/* controls */
button { font: inherit; }
.btn { background: var(--club); color: var(--club-ink); border: 0; padding: 11px 22px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn.secondary { background: var(--surface-2); color: var(--fg); }
.btn.quiet { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); clip-path: none; font-size: 15px; padding: 8px 14px; }
.btn.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); clip-path: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, nav button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible, .chip:focus-visible, .club-card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
textarea, input[type="text"], input[type="search"] { width: 100%; font: inherit; color: var(--fg); background: var(--bg-2); border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px; }
textarea { min-height: 150px; resize: vertical; font-size: 16px; }
.chip { background: var(--surface); border: 1px solid var(--line); color: var(--muted); padding: 5px 14px; cursor: pointer; font-family: var(--font-display); font-size: 16px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--club); color: var(--club-ink); border-color: var(--club); }

/* surfaces */
.panel { background: var(--surface); border-left: 3px solid var(--club); padding: 18px 20px; }
.panel.flat { background: var(--surface-2); border-left-color: var(--line); }
.notice { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--surface-2); font-size: 13px; }
.notice.bad { border-left-color: var(--bad); }
.notice.good { border-left-color: var(--good); }
.pill { display: inline-block; font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; background: var(--surface-2); padding: 1px 8px; color: var(--muted); font-weight: 600; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.club-card { text-align: left; background: var(--surface); border: 0; border-left: 3px solid hsl(var(--h) 78% 58%); padding: 14px; cursor: pointer; color: inherit; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; }
.club-card:hover { background: var(--surface-2); }
.club-card .name { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.club-card .meta { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; justify-content: space-between; }

/* hero (club hub) */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 18px 22px; align-items: center; background: linear-gradient(100deg, var(--club-dim), var(--surface) 70%); padding: 22px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); }
.hero h2 { font-size: 44px; }
.fixture { text-align: right; }
.fixture .wk { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: .9; }
@media (max-width: 760px) { .hero { grid-template-columns: auto 1fr; } .fixture { grid-column: 1 / -1; text-align: left; } .hero h2 { font-size: 34px; } }

/* segmented HUD meters */
.hud { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.meter .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.seg { height: 12px; background: var(--surface-2); -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 2px), transparent calc(5% - 2px) 5%); mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 2px), transparent calc(5% - 2px) 5%); }
.seg > i { display: block; height: 100%; background: var(--club); transform-origin: left; animation: grow .8s ease-out both; }
.seg > i.gain { background: linear-gradient(90deg, var(--club), var(--gold)); }
.delta { font-family: var(--font-mono); font-size: 13px; color: var(--gold); margin-left: 8px; }
@keyframes grow { from { transform: scaleX(0); } }

/* player cards */
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); align-items: start; }
.pcard { --rar: var(--silver); background: linear-gradient(170deg, color-mix(in srgb, var(--rar) 24%, var(--surface)), var(--surface) 65%); border-top: 3px solid var(--rar); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
.pcard.r-diamond { --rar: var(--diamond); } .pcard.r-gold { --rar: var(--goldc); } .pcard.r-silver { --rar: var(--silver); } .pcard.r-bronze { --rar: var(--bronze); }
.pcard[open] { grid-column: 1 / -1; }
.pcard > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; padding: 10px 12px; align-items: center; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard .ov { grid-row: 1 / 4; font-family: var(--font-display); font-size: 46px; font-weight: 700; color: var(--rar); line-height: 1; }
.pcard .role { font-family: var(--font-display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pcard .hdl { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.pcard .meta { font-size: 12px; color: var(--muted); }
.pcard.bench { opacity: .86; } .pcard.bench .ov { font-size: 34px; }
.pdetail { padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }

/* bars and scores */
.score { display: grid; grid-template-columns: 116px 1fr 34px; gap: 10px; align-items: center; font-size: 13px; }
.track { height: 8px; background: var(--surface-2); overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--club); transform-origin: left; animation: grow .8s ease-out both; }

/* stage scenes */
.stage { display: flex; flex-direction: column; gap: 18px; }
.onair { display: inline-flex; gap: 8px; align-items: center; font-family: var(--font-display); letter-spacing: .16em; font-size: 14px; font-weight: 700; text-transform: uppercase; }
.onair i { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 0 var(--bad); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.talk { display: flex; gap: 12px; align-items: flex-start; }
.avatar { width: 42px; height: 42px; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-family: var(--font-display); font-weight: 700; font-size: 20px; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.bubble { background: var(--surface); padding: 14px 18px; font-size: 18px; line-height: 1.45; position: relative; border-top-left-radius: 0; border-radius: 0 14px 14px 14px; max-width: 760px; }
.bubble.you { background: var(--club-dim); border-radius: 14px 0 14px 14px; align-self: flex-end; width: min(100%, 760px); padding: 14px; }
.who { font-family: var(--font-display); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.wcbar { display: flex; gap: 12px; align-items: center; font-size: 13px; }
.wcbar .seg { flex: 0 0 160px; height: 8px; }
.you-row { display: flex; justify-content: flex-end; }
.you-col { display: flex; flex-direction: column; gap: 8px; width: min(100%, 760px); }
.you-col .who { text-align: right; }

/* shotcalling HUD */
.alert { background: var(--surface); padding: 18px 20px 18px 22px; font-size: 20px; line-height: 1.4; border-left: 6px solid var(--warn); position: relative; }
.alert::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: repeating-linear-gradient(135deg, var(--warn) 0 10px, transparent 10px 20px); opacity: .7; }
.comms { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring .rbg { fill: none; stroke: var(--surface-2); stroke-width: 7; }
.ring .rfg { fill: none; stroke: var(--club); stroke-width: 7; stroke-linecap: butt; transition: stroke-dashoffset .1s linear; }
.ring .rt { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-size: 18px; }
.pips { display: flex; gap: 6px; } .pips i { width: 34px; height: 6px; background: var(--surface-2); } .pips i.on { background: var(--club); }
.voice { font-size: 20px; font-family: var(--font-mono); padding: 14px 16px; }
.dots { display: flex; gap: 6px; } .dots i { width: 30px; height: 6px; background: var(--surface-2); } .dots i.on { background: var(--club); }

/* report */
.report { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; background: linear-gradient(100deg, var(--club-dim), var(--surface) 75%); padding: 18px 22px; }
.grade { --gc: var(--club); width: 92px; height: 92px; display: grid; place-items: center; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); background: var(--gc); color: var(--club-ink); font-family: var(--font-display); font-size: 54px; font-weight: 700; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.grade.g-S { --gc: var(--diamond); } .grade.g-A { --gc: var(--goldc); } .grade.g-B { --gc: var(--silver); } .grade.g-C { --gc: var(--bronze); } .grade.g-D { --gc: var(--muted); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.big { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: .95; }
.big small { font-size: 18px; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.burst { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: .04em; text-align: right; animation: pop .6s .25s cubic-bezier(.2,1.6,.4,1) both; }
@media (max-width: 640px) { .report { grid-template-columns: auto 1fr; } .burst { grid-column: 1 / -1; text-align: left; } }
mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 2px; }
.fix { color: var(--good); font-weight: 600; }
.quote { background: var(--bg-2); padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.summary-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--surface); padding: 12px 16px; border-left: 3px solid var(--club); }
.summary-card .grade { width: 56px; height: 56px; font-size: 32px; animation-delay: .1s; }

/* tables, history, misc */
.scroll { overflow-x: auto; max-width: 100%; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--club); border-radius: 50%; animation: spin .9s linear infinite; display: inline-block; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.check-ok { color: var(--good); font-weight: 600; } .check-bad { color: var(--bad); font-weight: 600; }
details.hist > summary { cursor: pointer; }
footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
a { color: var(--club); }
@media (max-width: 520px) { .score { grid-template-columns: 96px 1fr 32px; } h2 { font-size: 28px; } .comms { grid-template-columns: 1fr; } .bubble { font-size: 16px; } }
/* match day, tables */
.board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; background: linear-gradient(100deg, var(--club-dim), var(--surface) 75%); padding: 20px 22px; }
.board .side { display: flex; align-items: center; gap: 12px; min-width: 0; }
.board .side.b { justify-content: flex-end; text-align: right; }
.board .sc { font-family: var(--font-display); font-size: 68px; font-weight: 700; line-height: 1; text-align: center; white-space: nowrap; }
.board .sc.win { color: var(--gold); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@media (max-width: 640px) { .board { grid-template-columns: 1fr; } .board .side, .board .side.b { justify-content: flex-start; text-align: left; } .board .sc { font-size: 52px; } }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tbl tr.me td { background: color-mix(in srgb, var(--club) 20%, transparent); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const Z_SCALE = 6;      // difference of 6 standard deviations = 10:1 odds per game
const MOD_CAP = 0.35;   // most one language-driven club value (chemistry or morale) can add, in standard deviations

function playMatch(seed, week, a, b) {   // best of 3 games, repeatable from the seed

  while (ga < 2 && gb < 2) { if (rng() < p) ga++; else gb++; }

}

}
const SCHEDULES = {};

function standings(leagueId, results) {

/* ---------- club hub */
function playerCard(p, sub) {
  const r = RAT[p.id];
  return `<details class="pcard r-${rarity(r.overall)} ${sub ? 'bench' : ''}"><summary><span class="ov">${r.overall}</span><span class="role">${sub ? 'Sub · ' : ''}${ROLE_LABEL[p.role] || ''}</span><span class="hdl">${esc(p.handle)}</span><span class="meta mono">${esc(p.nationality || '--')} · age ${r.age == null ? '?' : r.age}</span></summary>${playerDetail(p)}</details>`;
}
function playerDetail(p) {
  const r = RAT[p.id], w = r.why;
  const parts = [['League', w.league], ['Experience', w.experience], ['International', w.international], ['Sub', w.sub], ['Age', w.age]].filter(x => x[1] !== 0);
  return '<div class="pdetail">' + ATTRS.map(a => bar(a[1], r[a[0]])).join('') +
    '<p class="small muted">Why ' + r.overall + ': ' + parts.map(x => x[0] + ' ' + (x[1] > 0 ? '+' : '') + x[1]).join(', ') + '. The game\'s estimate, not a fact about the real player.</p></div>';
}
function viewClub() {
  const t = TEAM[G.clubId], L = lineup(t.id);

function fixtureBlock() {

}
function tableHtml(leagueId, results) {

}
function viewLong() {

    <div class="row spread"><span class="onair"><i></i>${esc(sc.room)}</span><span class="small muted">${esc(sc.title)}</span></div>

function checkBar(label, act) {

function updateWc() {
  const el = $('#wc'); if (!el) return; const n = wordCount(ui.draft), m = ui.scene.minWords;
  el.textContent = n + ' words · aim for ' + m + '+' + (n >= m ? ' ✓' : '');

function viewShot() {
  const s = ui.shot;
  if (s.results) return viewFeedback(s.results, { next: 'finish' });
  const total = s.situations.length;
  const pips = n => '<div class="pips" aria-label="Call ' + n + ' of ' + total + '">' + s.situations.map((_, k) => '<i class="' + (k < n ? 'on' : '') + '"></i>').join('') + '</div>';
  if (s.review) {
    return `<div class="stage">${flowHeader(1)}<div class="row spread"><span class="onair"><i></i>Comms · calls locked</span>${pips(total)}</div><div class="stack" style="gap:10px">${s.situations.map((q, k) => `<div class="panel"><div class="small muted">${k + 1}. ${esc(q)}</div><div class="mono" style="margin-top:4px;font-size:17px">${esc(s.answers[k])}</div><div class="small muted mono">${s.secs[k].toFixed(1)} s typing</div></div>`).join('')}</div>${checkBar('Check the round', 'check-shot')}</div>`;
  }

  return `<div class="stage">${flowHeader(1)}
    <div class="row spread"><span class="onair"><i></i>Comms · live</span>${pips(i)}</div>

    <div class="comms"><div class="ring" aria-label="Speed credit"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="rbg" cx="40" cy="40" r="34"/><circle id="ringfg" class="rfg" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0" transform="rotate(-90 40 40)"/></svg><div class="rt" id="timer">0.0</div></div>
      <div class="stack" style="gap:6px"><label class="label" for="call">Voice line · type your call, press Enter</label><input type="text" id="call" class="voice" autocomplete="off" placeholder="Group mid, drake in 30"><p class="small muted">The ring starts with your first letter and shows your speed credit. It counts typing only. No hints in this scene.</p></div></div>
    <div class="row"><button class="btn" data-act="next-call">${i + 1 < total ? 'Send call' : 'Send last call'}</button></div></div>`;
}

/* ---------- feedback (also used by history) */
function markup(answer, issues) {
  const ranges = [];
  issues.forEach((it, i) => { if (!it.span) return; const s = answer.indexOf(it.span); if (s < 0) return; const e = s + it.span.length; if (ranges.some(r => s < r.e && e > r.s)) return; ranges.push({ s, e, i }); });
  ranges.sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  ranges.forEach(r => { out += esc(answer.slice(pos, r.s)) + '<mark title="Mistake ' + (r.i + 1) + '">' + esc(answer.slice(r.s, r.e)) + '</mark>'; pos = r.e; });
  return out + esc(answer.slice(pos));
}
function itemHtml(it, dims, n, thai) {
  const th = thai && thai[n] ? thai[n] : null;
  return `<div class="panel stack">
    ${it.situation && n != null ? '<div class="small muted">' + esc(it.situation) + '</div>' : ''}
    <div><div class="label">Your sentence</div><div class="quote">${markup(it.answer, it.issues)}</div></div>
    <div><div class="label">Corrected</div><div class="quote fix">${esc(it.corrected)}</div></div>
    <div><div class="label">Meaning</div><p>${esc(it.meaning)}</p>${th ? '<p class="muted" lang="th">' + esc(th.meaningTh || '') + '</p>' : ''}</div>
    ${it.issues.length ? '<div><div class="label">Why</div><ol style="margin:4px 0 0;padding-left:20px">' + it.issues.map((x, k) => '<li><mark>' + esc(x.span || '…') + '</mark> → <span class="fix">' + esc(x.fix) + '</span><br><span class="muted">' + esc(x.reason) + '</span>' + (th && th.reasonsTh && th.reasonsTh[k] ? '<br><span class="muted" lang="th">' + esc(th.reasonsTh[k]) + '</span>' : '') + '</li>').join('') + '</ol></div>' : '<p class="check-ok">No mistakes found.</p>'}
    <div class="stack" style="gap:6px">${dims.map(d => bar(d[1], it.scores[d[0]])).join('')}${it.seconds != null ? '<p class="small muted mono">Typing time ' + it.seconds.toFixed(1) + ' s · speed credit ' + Math.round(speedFactor(it.seconds) * 100) + '%</p>' : ''}</div></div>`;
}
function viewFeedback(entry, opts) {
  const dims = entry.kind === 'shot' ? DIMS_SHOT : DIMS_LONG;
  const eff = entry.effect, g = gradeOf(entry.total);
  const thaiBtn = opts.history ? '' : '<button class="btn secondary" data-act="thai" ' + (ui.checking ? 'disabled' : '') + '>' + (entry.thai ? 'Thai shown' : 'ไทย · Thai help') + '</button>';
  return `<div class="stack">${opts.history ? '' : flowHeader(entry.kind === 'shot' ? 1 : 0)}
    <section class="report"><div class="grade g-${g}" aria-label="Grade ${g}">${g}</div>
      <div><div class="label">${esc(entry.title)} report${opts.history ? ' · week ' + (entry.week + 1) : ''}</div><div class="big"><span data-count="${entry.total}">${entry.total}</span><small> / 100</small></div></div>
      <div class="burst">${eff.delta > 0 ? '+' + eff.delta + ' ' + esc(VALUE_LABEL[eff.target]) : 'No change to ' + esc(VALUE_LABEL[eff.target].toLowerCase())}</div></section>
    ${entry.items.map((it, n) => itemHtml(it, dims, entry.items.length > 1 ? n : (it.situation ? 0 : null), entry.thai)).join('')}
    ${entry.chunk ? '<div class="panel flat"><div class="label">A chunk to keep</div><p style="font-size:18px;margin-top:4px">' + esc(entry.chunk) + '</p></div>' : ''}
    ${ui.error && !opts.history ? '<div class="notice bad" role="alert">' + esc(ui.error) + '</div>' : ''}
    ${opts.history ? '' : '<div class="row">' + thaiBtn + '<button class="btn" data-act="' + (opts.next === 'finish' ? 'finish' : 'to-shot') + '">' + (opts.next === 'finish' ? 'End the match day' : 'Next: shotcalling') + '</button></div>'}</div>`;
}
function viewSummary() {
  const s = ui.summary, t = TEAM[G.clubId];
  const card = e => `<div class="summary-card"><div class="grade g-${gradeOf(e.total)}">${gradeOf(e.total)}</div><div><div class="label">${esc(e.title)}</div><div class="mono">${e.total} / 100</div></div><div class="burst" style="font-size:20px">${e.delta > 0 ? '+' + e.delta + ' ' + esc(VALUE_LABEL[e.target]) : 'no change'}</div></div>`;
  return `<div class="stack"><div class="row">${badge(t, 56)}<div><div class="label">Match day complete</div><h2>Week ${s.week + 1} done</h2></div></div>
    <div class="stack" style="gap:10px">${card(s.long)}${card(s.shot)}</div>
    <section class="panel stack"><div class="label">Club values</div><div class="hud">${['reputation', 'chemistry', 'morale'].map(k => valueMeter(k, s.end[k], s.start[k])).join('')}</div></section>
    <div class="row"><button class="btn" data-act="nav" data-v="club">Back to the club</button></div></div>`;
}

/* ---------- history, save, credits */
function viewHistory() {
  if (ui.history == null) return '<div class="panel"><span class="spinner"></span>Loading history…</div>';
  if (!ui.history.length) return '<div class="stack"><h2>History</h2><div class="panel">Your answers and their feedback will be listed here after your first check.</div></div>';
  return '<div class="stack"><h2>History</h2><p class="muted">' + ui.history.length + ' checked answers, newest first.</p>' + ui.history.map(e => '<details class="panel hist" ' + (ui.expand[e.id] ? 'open' : '') + ' data-id="' + esc(e.id) + '"><summary><span class="row spread"><span><strong>' + esc(e.title) + '</strong> <span class="muted small">week ' + (e.week + 1) + ' · ' + new Date(e.at).toLocaleDateString() + '</span></span><span class="mono">' + gradeOf(e.total) + ' · ' + e.total + '</span></span></summary><div style="margin-top:12px">' + viewFeedback(e, { history: true }) + '</div></details>').join('') + '</div>';
}
function viewSave() {
  const where = Store.mode === 'cloud' ? 'Your save lives in your private claude.ai account storage and follows you to your other devices.' : 'Your save is stored on this device only. Open the game in claude.ai, signed in, to keep it in your account.';
  return '<div class="stack"><h2>Save</h2><div class="panel stack"><p>' + esc(where) + '</p><p class="small muted">The game saves by itself after every step. A backup file protects you if the page is ever republished as a new artifact.</p>' +
    '<div class="row"><button class="btn" data-act="export">Export backup</button><label class="btn secondary" for="import-file" style="cursor:pointer">Import backup</label><input type="file" id="import-file" accept=".json,application/json" hidden></div>' + (ui.exportText ? '<div class="stack" style="gap:6px"><p class="small muted">Downloads are not available here. Copy this text into a .json file:</p><textarea readonly id="export-text" style="min-height:90px">' + esc(ui.exportText) + '</textarea></div>' : '') + (ui.notice ? '<div class="notice ' + (ui.notice.bad ? 'bad' : 'good') + '" role="status">' + esc(ui.notice.text) + '</div>' : '') + importPanel() + '</div>' +
    '<div class="panel stack"><h3>Start again</h3>' + (ui.confirmReset ? '<p>This deletes your club, week, values and the whole history. It cannot be undone.</p><div class="row"><button class="btn danger" data-act="reset-yes">Delete everything</button><button class="btn quiet" data-act="reset-no">Keep my save</button></div>' : '<div class="row"><button class="btn danger" data-act="reset">Delete save and start again</button></div>') + '</div>' +
    '<div class="panel stack"><h3>Scoring self-test</h3><p class="small muted">Sends three sample answers to Claude and checks that a harder structure with some mistakes still scores above a plain correct one-clause answer (spec, scoring rule 2). Uses 3 checks.</p><div class="row"><button class="btn secondary" data-act="selftest" ' + (ui.checking ? 'disabled' : '') + '>Run the test</button></div>' + selftestHtml() + '</div></div>';

function importPanel() {
  const d = ui.importDoc; if (!d) return '';
  return '<div class="panel flat stack"><strong>Backup found</strong><p class="small">Club: ' + esc((TEAM[d.save.clubId] || {}).name || d.save.clubId) + ' · week ' + (d.save.week + 1) + ' · ' + d.history.length + ' history entries · exported ' + new Date(d.exportedAt).toLocaleString() + '</p><p class="small muted">Importing replaces your current save and history.</p><div class="row"><button class="btn" data-act="import-yes">Replace my save</button><button class="btn quiet" data-act="import-no">Cancel</button></div></div>';
}
const SELFTEST = {
  scene: { title: 'Press conference', prompt: 'Journalist: You lost 1-2 to Dplus. What went wrong today?', minWords: 0 },
  answers: [['A. Plain, fully correct, one clause', 'We played badly today.'], ['B. Harder structure, partly wrong', 'Although we was ahead in the early game, we lose the fights because our communication were not good.'], ['C. Very short', 'Bad game.']]
};
function selftestHtml() {
  const s = ui.selftest; if (!s) return '';
  if (s.running) return '<p><span class="spinner"></span>Running check ' + (s.done.length + 1) + ' of 3…</p>';
  if (s.error) return '<div class="notice bad">' + esc(s.error) + '</div>';
  const [A, B, C] = s.done;
  const t = [[B.total > A.total, 'B total above A (' + B.total + ' vs ' + A.total + ')'], [B.scores.accuracy < A.scores.accuracy, 'B accuracy below A (' + B.scores.accuracy + ' vs ' + A.scores.accuracy + ')'], [A.total > C.total, 'A total above C (' + A.total + ' vs ' + C.total + ')']];
  return '<ul style="margin:6px 0 0;padding-left:20px">' + t.map(x => '<li class="' + (x[0] ? 'check-ok' : 'check-bad') + '">' + (x[0] ? 'PASS ' : 'FAIL ') + esc(x[1]) + '</li>').join('') + '</ul><p class="small muted">Run this again after any change to the scoring instructions.</p>';
}
function viewCredits() {
  return '<div class="stack"><h2>Credits</h2><div class="panel stack"><p>Team, player, role, nationality, age and team-history facts in this game come from <a href="https://liquipedia.net/leagueoflegends" target="_blank" rel="noopener">Liquipedia</a> (League of Legends wiki), collected through its MediaWiki API on ' + esc(SNAP.meta.snapshotDate) + '. The content is licensed <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC-BY-SA 3.0</a>.</p><p>Changes made: facts were selected, combined and stored in a compact format. Overall ratings, attributes and potential are the game\'s own estimates (rules v' + esc(DATA.ratings.meta.rulesVersion) + ') and are not facts about the real players.</p><p>Players appear by in-game handle only. Personalities and backgrounds, where the game adds them, are invented. Club colours and badges are made by the game, not the clubs\' real logos.</p><p class="small muted">Fan project for personal English practice. Not affiliated with Riot Games or Liquipedia.</p></div></div>';
}

/* ---------------------------------------------------------------- render */
function animateIn() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 700); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function render() {
  const nav = $('#nav'), brand = $('#brand');
  document.documentElement.style.setProperty('--club-h', G ? teamHue(G.clubId) : 196);
  const tabs = G ? [['club', 'Club'], ['league', 'League'], ['history', 'History'], ['save', 'Save'], ['credits', 'Credits']] : [['club', 'Choose club'], ['credits', 'Credits']];
  const inScene = ['match', 'long', 'shot', 'feedback-long', 'summary', 'season-end'].indexOf(ui.view) >= 0;
  nav.innerHTML = tabs.map(t => '<button data-act="nav" data-v="' + t[0] + '" ' + ((ui.view === t[0] || (t[0] === 'club' && (inScene || (!G && ui.view !== 'credits')))) ? 'aria-current="page"' : '') + '>' + t[1] + '</button>').join('');
  brand.innerHTML = G ? badge(TEAM[G.clubId], 38) + '<div><div class="brand-name">' + esc(TEAM[G.clubId].name) + '</div><div class="brand-sub">' + esc(LEAGUE[TEAM[G.clubId].leagueId].name) + ' · week ' + (G.week + 1) + '</div></div>' : '<div><div class="brand-name">Esports Club English</div><div class="brand-sub">Manage a club. Win in English.</div></div>';
  let html = '';
  if (ui.view === 'boot') html = '<div class="panel"><span class="spinner"></span>Loading your game…</div>';
  else if (!G && ui.view !== 'credits') html = viewPicker();
  else if (ui.view === 'club') html = viewClub();
  else if (ui.view === 'league') html = viewLeague();
  else if (ui.view === 'match') html = viewMatch();
  else if (ui.view === 'season-end') html = viewSeasonEnd();
  else if (ui.view === 'long') html = viewLong();
  else if (ui.view === 'feedback-long') html = viewFeedback(ui.result, { next: 'shot' });
  else if (ui.view === 'shot') html = viewShot();
  else if (ui.view === 'summary') html = viewSummary();
  else if (ui.view === 'history') html = viewHistory();
  else if (ui.view === 'save') html = viewSave();
  else if (ui.view === 'credits') html = viewCredits();
  app.innerHTML = html;
  const sv = $('#savestate'); if (sv) sv.textContent = Store.status;
  if (ui.view === 'long') updateWc();
  if (ui.view === 'shot' && ui.shot && !ui.shot.review && !ui.shot.results) { const c = $('#call'); if (c) { c.focus(); } }
  if (ui.view === 'feedback-long' || ui.view === 'shot' || ui.view === 'history') animateIn();
  if (ui.view === 'history' && ui.history == null) Store.loadHistory().then(h => { ui.history = h; if (ui.view === 'history') render(); });
}

/* ---------------------------------------------------------------- actions */
function startElapsed() {
  ui.startedAt = Date.now();
  clearInterval(ui.elTimer);
  ui.elTimer = setInterval(() => { const el = $('#elapsed'); if (el) el.textContent = Math.floor((Date.now() - ui.startedAt) / 1000) + 's'; else clearInterval(ui.elTimer); }, 500);
}
function makeEntry(kind, title, res, target) {
  const delta = effectFor(res.total);
  const entry = { id: 'h-' + Date.now(), at: Date.now(), week: G.week, year: G.season.year, kind, title, items: res.items, total: res.total, chunk: res.chunk, effect: { target, delta }, thai: null };
  G.values[target] = clamp(G.values[target] + delta, 0, 100);
  return entry;
}
async function runCheck(fn, onOk) {
  ui.checking = true; ui.error = null; ui.ctl = new AbortController(); render(); startElapsed();
  try { const res = await fn(ui.ctl.signal); ui.checking = false; ui.ctl = null; await onOk(res); }
  catch (e) { ui.checking = false; ui.ctl = null; if (!(e && e.code === 'cancelled')) ui.error = errCopy(e); render(); }
}
const ACTIONS = {
  nav(b) { ui.exportText = null; ui.notice = null; ui.confirmReset = false; if (b.dataset.v === 'history') ui.history = null; go(b.dataset.v); },
  filter(b) { ui.filter = b.dataset.v; render(); },
  pick(b) { ui.pending = b.dataset.id; render(); window.scrollTo(0, 0); },
  unpick() { ui.pending = null; render(); },
  async start(b) { G = newGame(b.dataset.id); ui.pending = null; await persist(); go('club'); },
  async play() {
    if (G.week >= seasonWeeks()) return go('season-end');
    if (G.flow.week !== G.week) G.flow = { week: G.week, longDone: false, startValues: clone(G.values) };
    if (!G.flow.startValues) G.flow.startValues = clone(G.values);
    await ensureWeekPlayed();                 // the match is played first, with the club values as they are now
    if (G.flow.longDone) return beginShot();
    go('match');
  },
  'to-long'() { ui.scene = buildLongScene(G.week); ui.draft = ''; ui.hint = false; go('long'); },
  async 'new-season'() {
    const r = seasonResult();
    G.seasons.push({ year: G.season.year, champion: r.champion, finish: r.finish, wins: r.wins, losses: r.losses });
    G.season = { year: G.season.year + 1, seed: newSeed(), results: [] }; G.week = 0; G.flow = { week: 0, longDone: false };
    await persist(); go('club');
  },
  hint() { ui.hint = !ui.hint; render(); },
  stop() { if (ui.ctl) ui.ctl.abort(); },
  'check-long'() {
    const answer = ui.draft.trim();
    if (!answer) { ui.error = 'Write your answer first.'; render(); return; }
    const sc = ui.scene;
    runCheck(sig => checkLong(sc, answer, sig), async res => {
      const entry = makeEntry('long', sc.title, res, EFFECT_TARGET[sc.type]); entry.items[0].situation = sc.prompt;
      G.flow = { week: G.week, longDone: true, startValues: G.flow.startValues, long: { title: sc.title, total: entry.total, delta: entry.effect.delta, target: entry.effect.target } };
      await Store.addHistory(entry); await persist();
      ui.result = entry; go('feedback-long');
    });
  },
  'to-shot'() { beginShot(); },
  'next-call'() { submitCall(); },
  'check-shot'() {
    const s = ui.shot;
    runCheck(sig => checkShot(s.situations, s.answers, s.secs, sig), async res => {
      const entry = makeEntry('shot', 'Shotcalling', res, EFFECT_TARGET.shot);
      await Store.addHistory(entry); await persist(); s.results = entry; render();
    });
  },
  async finish() {
    const r = ui.shot && ui.shot.results, f = G.flow;
    ui.summary = { week: G.week, start: f.startValues || clone(G.values), end: clone(G.values),
      long: f.long || { title: 'Scene', total: 0, delta: 0, target: 'reputation' },
      shot: r ? { title: 'Shotcalling', total: r.total, delta: r.effect.delta, target: r.effect.target } : { title: 'Shotcalling', total: 0, delta: 0, target: 'chemistry' } };
    G.week += 1; G.flow = { week: G.week, longDone: false }; ui.shot = null; await persist(); go('summary');
  },
  async thai() {
    const entry = ui.shot && ui.shot.results ? ui.shot.results : ui.result;
    if (!entry || entry.thai) return;
    const data = entry.items.map((it, n) => ({ n, meaning: it.meaning, reasons: it.issues.map(i => i.reason) }));
    const prompt = 'Translate into natural, simple Thai. The input is JSON: a list of items, each with an English "meaning" and a list of English "reasons".\n' + JSON.stringify(data) + '\nReply with only a JSON array with one object per item in the same order: {"meaningTh":"...","reasonsTh":["...", "..."]}. reasonsTh must have the same length and order as reasons.';
    ui.checking = true; ui.error = null; render();
    try {
      const r = await askJson(prompt, undefined, 'quick');
      if (!Array.isArray(r)) throw bad();
      entry.thai = r.map(x => ({ meaningTh: str(x && x.meaningTh), reasonsTh: Array.isArray(x && x.reasonsTh) ? x.reasonsTh.map(str) : [] }));
      await Store.addHistory(entry);
    } catch (e) { ui.error = errCopy(e); }
    ui.checking = false; render();
  },
  async export() {
    const hist = await Store.loadHistory();
    const doc = { format: 'esports-club-english-save', version: 1, exportedAt: Date.now(), save: G, history: hist };
    const text = JSON.stringify(doc, null, 1), name = 'esports-club-save-' + new Date().toISOString().slice(0, 10) + '.json';
    ui.notice = null; ui.exportText = null;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (!dl) throw { code: 'unavailable' };
      await dl.save({ filename: name, data: text }); ui.notice = { text: 'Backup saved.' };
    } catch (e) {
      if (e && e.code === 'declined') ui.notice = { text: 'Backup cancelled.', bad: true }; else ui.exportText = text;
    }
    render();
  },
  async 'import-yes'() {
    const d = ui.importDoc; await Store.clearAll();
    G = upgradeSave(d.save); for (const h of d.history) await Store.addHistory(h);
    await persist(); ui.importDoc = null; ui.notice = { text: 'Backup restored.' }; ui.history = null; render();
  },
  'import-no'() { ui.importDoc = null; render(); },
  reset() { ui.confirmReset = true; render(); },
  'reset-no'() { ui.confirmReset = false; render(); },
  async 'reset-yes'() { await Store.clearAll(); G = null; ui.confirmReset = false; ui.history = null; ui.view = 'club'; render(); },
  async selftest() {
    ui.selftest = { running: true, done: [] }; ui.checking = true; render();
    try {
      for (const a of SELFTEST.answers) {
        const r = await checkLong(SELFTEST.scene, a[1], undefined, 0);
        ui.selftest.done.push(r.items[0]); render();
      }
      ui.selftest.running = false;
    } catch (e) { ui.selftest = { error: errCopy(e) }; }
    ui.checking = false; render();
  }
};
function beginShot() {
  const situations = SHOT_ROUNDS[G.week % SHOT_ROUNDS.length];
  ui.shot = { situations, answers: [], secs: [], idx: 0, started: null, review: false, results: null }; ui.error = null; go('shot');
}
function submitCall() {
  const s = ui.shot, inp = $('#call'); const text = inp ? inp.value.trim() : '';
  if (!text) { if (inp) inp.focus(); return; }
  const secs = s.started ? (performance.now() - s.started) / 1000 : 0;
  clearInterval(ui.callTimer); s.answers.push(text); s.secs.push(secs); s.started = null; s.idx += 1;
  if (s.idx >= s.situations.length) s.review = true;
  render();
}
function tickRing(s) {
  const t = $('#timer'), ring = $('#ringfg');
  if (!s.started || !t) { clearInterval(ui.callTimer); return; }
  const sec = (performance.now() - s.started) / 1000;
  t.textContent = sec.toFixed(1);
  if (ring) ring.setAttribute('stroke-dashoffset', (213.6 * (1 - speedFactor(sec))).toFixed(1));
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACTIONS[b.dataset.act] && !b.disabled) ACTIONS[b.dataset.act](b); });
document.addEventListener('input', e => {
  if (e.target.id === 'answer') { ui.draft = e.target.value; updateWc(); }
  else if (e.target.id === 'club-search') { ui.search = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#club-search'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (e.target.id === 'call') {
    const s = ui.shot;
    if (s && s.started == null) { s.started = performance.now(); clearInterval(ui.callTimer); ui.callTimer = setInterval(() => tickRing(s), 100); }
  }
});
document.addEventListener('keydown', e => { if (e.target.id === 'call' && e.key === 'Enter') { e.preventDefault(); submitCall(); } });
document.addEventListener('change', async e => {
  if (e.target.id !== 'import-file' || !e.target.files[0]) return;
  try {
    const doc = JSON.parse(await e.target.files[0].text());
    if (doc.format !== 'esports-club-english-save' || !doc.save || !TEAM[doc.save.clubId] || !Array.isArray(doc.history)) throw new Error('bad');
    ui.importDoc = { save: doc.save, history: doc.history, exportedAt: doc.exportedAt || Date.now() }; ui.notice = null;
  } catch (err) { ui.importDoc = null; ui.notice = { text: 'That file is not a backup from this game.', bad: true }; }
  render();
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-id]')) ui.expand[e.target.dataset.id] = e.target.open; }, true);

/* ---------------------------------------------------------------- start */
(async function boot() {
  render();
  await Store.init();
  const saved = await Store.loadSave();
  if (saved && TEAM[saved.clubId]) { const old = saved.schema; G = upgradeSave(saved); if (old !== G.schema) await persist(); Store.setStatus(Store.mode === 'cloud' ? 'Saved to your claude.ai account' : 'Saved on this device only'); go('club'); }
  else { Store.setStatus(Store.mode === 'cloud' ? 'Your save will be kept in your claude.ai account' : 'Your save will stay on this device'); go('club'); }
})();
if (window.__ECG_TEST) window.__ecg = { roundRobin, playMatch, standings, scheduleFor, lineup, strength, modifier, Z, TEAM, SNAP, RAT, upgradeSave, newGame, setG: g => { G = g; } };   // set only by the local preview, for checks
})();
</script>
